<mat-tab-group
    [class]="className"
    [mat-stretch-tabs]="isStretchSignal()"
    [selectedIndex]="selectedIndexSignal()"
    (selectedIndexChange)="selectedIndexChanged($event)"
    (selectedTabChange)="selectedTabChanged($event)"
>
    @for (item of list?.collection; track item.uid) {
        <mat-tab [class]="item.className" [label]="item.label" [disabled]="!item.isEnabled" (click)="list?.actionItem(item)"></mat-tab>
    }
</mat-tab-group>
