<mat-table
    matSort
    class="flex-grow-1 scroll-vertical"
    [trackBy]="source.trackBy"
    [dataSource]="source.itemsSignal()"
    [class.header-hidden]="settingsSignal()?.isHideHeader"
    [matSortActive]="source.sortActiveSignal()"
    [matSortDirection]="source.sortDirectionSignal()"
    (matSortChange)="sortEventHandler($event)"
>
    <ng-container *ngFor="let column of columnsSignal(); trackBy: columnTrackBy">
        <ng-container [matColumnDef]="column.name">
            <mat-header-cell
                class="px-2"
                mat-sort-header
                [disableClear]="true"
                [disabled]="column.isDisableSort"
                [ngClass]="column.headerClassName"
                *matHeaderCellDef
            >
                <span [innerHTML]="column.headerId | viTranslate"></span>
            </mat-header-cell>

            <mat-cell
                *matCellDef="let row"
                (click)="cellClickHandler(row, column, $event)"
                class="p-2"
                [ngClass]="row | viCdkTableColumnClassName: column"
                [ngStyle]="row | viCdkTableColumnStyleName: column"
            >
                <ng-container [ngSwitch]="column.isImage">
                    <img
                        *ngSwitchCase="true"
                        [ngClass]="row | viCdkTableCellClassName: column"
                        [ngStyle]="row | viCdkTableCellStyleName: column"
                        [src]="column.isAsync ? (row | viCdkTableCellValue: column) : (row | viCdkTableCellValuePure: column)"
                    />
                    <span
                        *ngSwitchDefault
                        [ngClass]="row | viCdkTableCellClassName: column"
                        [ngStyle]="row | viCdkTableCellStyleName: column"
                        [vi-html-content-title]="column.isAsync ? (row | viCdkTableCellValue: column) : (row | viCdkTableCellValuePure: column)"
                    ></span>
                </ng-container>
            </mat-cell>
        </ng-container>
    </ng-container>

    <mat-header-row *matHeaderRowDef="columnNamesSignal()"></mat-header-row>

    <mat-row
        *matRowDef="let row; columns: columnNamesSignal()"
        class="mat-list-item"
        [class.active]="settingsSignal()?.isInteractive"
        [ngClass]="row | viCdkTableRowClassName: rowsSignal() : selectedRowsSignal()"
        [ngStyle]="row | viCdkTableRowStyleName: rowsSignal() : selectedRowsSignal()"
        (click)="rowClickHandler(row, $event)"
    ></mat-row>

    <p class="p-5 flex-shrink-0 text-center mouse-disabled" [vi-translate]="settingsSignal()?.noDataId" *matNoDataRow></p>
</mat-table>

<mat-progress-bar class="flex-shrink-0 border-line variant" [mode]="source.isLoadingSignal() ? 'indeterminate' : 'determinate'"></mat-progress-bar>

<div class="paginator-container d-flex align-items-center justify-content-end flex-shrink-0">
    <ng-content></ng-content>
    <mat-paginator
        class="flex-shrink-0"
        [pageSize]="source.pageSizeSignal()"
        [pageIndex]="source.pageIndexSignal()"
        [length]="source.totalSignal()"
        (page)="pageEventHandler($event)"
        [pageSizeOptions]="paginatorSignal()?.pageSizes"
        [showFirstLastButtons]="paginatorSignal()?.showFirstLastButtons"
        [hidePageSize]="paginatorSignal()?.hidePageSize"
        *ngIf="paginatorSignal()"
    ></mat-paginator>
</div>
