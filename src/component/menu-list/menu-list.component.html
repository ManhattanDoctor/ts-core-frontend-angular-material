@for (item of list?.filtered; track item.uid) {
    <button mat-menu-item [class]="item.className" (click)="list?.actionItem(item)">
        @if (isMaterialIcon) {
            <mat-icon [fontIcon]="item.iconId"></mat-icon>
        } @else {
            <span [class]="item.iconId"></span>
        }
        <span [innerHTML]="item.label" [title]="item.label"></span>
    </button>
}
