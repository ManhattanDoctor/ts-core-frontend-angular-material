<ng-container *ngFor="let item of list?.filtered; trackBy: list?.trackBy">
    <button mat-menu-item [ngClass]="item.className" (click)="list?.actionItem(item)">
        <mat-icon [fontIcon]="item.iconId" *ngIf="isMaterialIcon"></mat-icon>
        <span [ngClass]="item.iconId" *ngIf="!isMaterialIcon"></span>
        <span [innerHTML]="item.label" [title]="item.label"></span>
    </button>
</ng-container>
